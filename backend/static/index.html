<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#28736c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="写作助手" />
    <title>文档智能写作助手</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/icons/app-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/static/icons/app-icon.png" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>文档智能写作助手</h1>
          <p id="serviceState">正在连接后端</p>
        </div>
        <div class="topbar-actions">
          <button id="installAppBtn" class="ghost-button install-app-button" type="button" hidden>安装应用</button>
          <button id="modelSettingsBtn" class="ghost-button" type="button">模型设置</button>
          <button id="refreshTasksBtn" class="ghost-button" type="button">刷新任务</button>
          <button id="newTaskBtn" class="ghost-button" type="button">清空</button>
        </div>
      </header>

      <main class="workspace">
        <section class="side-panel requirement-panel" aria-label="写作要求">
          <div class="panel-head">
            <h2>写作要求</h2>
            <span id="taskBadge" class="status-badge">未创建</span>
          </div>

          <label>
            主题
            <input id="topicInput" type="text" value="人工智能对学习方式的影响" />
          </label>

          <div class="field-grid">
            <label>
              文体
              <select id="genreSelect">
                <option>议论文</option>
                <option>说明文</option>
                <option>记叙文</option>
                <option>应用文</option>
                <option>报告</option>
                <option>总结</option>
              </select>
            </label>

            <label>
              字数
              <input id="wordCountInput" type="number" min="200" max="5000" step="100" value="800" />
            </label>
          </div>

          <label>
            风格
            <select id="styleSelect">
              <option>正式、逻辑清晰</option>
              <option>自然、亲切</option>
              <option>简洁、明快</option>
              <option>生动、有感染力</option>
              <option>规范、适合公文</option>
            </select>
          </label>

          <label>
            补充要求
            <textarea id="extraInput" rows="5">观点积极，结合现实例子</textarea>
          </label>

          <button id="generateBtn" class="primary-button" type="button">生成文档</button>

          <div class="task-list-wrap">
            <h3>最近任务</h3>
            <div id="taskList" class="task-list"></div>
          </div>
        </section>

        <section class="document-panel" aria-label="正文内容">
          <div class="document-toolbar">
            <div>
              <h2 id="documentTitle">等待生成</h2>
              <p id="documentMeta">生成的正文会显示在这里</p>
            </div>
            <div class="toolbar-buttons">
              <button id="saveDraftBtn" class="ghost-button" type="button" disabled>保存正文</button>
              <button id="summaryBtn" class="ghost-button" type="button" disabled>生成摘要</button>
            </div>
          </div>

          <div class="content-grid">
            <section class="draft-view" aria-label="正文">
              <h3>正文</h3>
              <textarea id="draftEditor" class="draft-editor" spellcheck="false" disabled></textarea>
            </section>
          </div>
        </section>

        <section class="side-panel action-panel" aria-label="文档操作">
          <div class="panel-head">
            <h2>文档操作</h2>
            <span id="versionBadge" class="status-badge">v0</span>
          </div>

          <div class="export-row">
            <button id="exportDocxBtn" class="ghost-button" type="button" disabled>导出 Word</button>
            <button id="exportTxtBtn" class="ghost-button" type="button" disabled>导出文本</button>
          </div>

          <div class="summary-block">
            <h3>摘要</h3>
            <div id="summaryContent" class="summary-content empty-state">暂无摘要</div>
          </div>

          <div class="message-area" id="messageArea" role="status"></div>
        </section>
      </main>
    </div>

    <dialog id="modelDialog" class="model-dialog" aria-labelledby="modelDialogTitle">
      <form id="modelConfigForm" method="dialog">
        <div class="dialog-head">
          <div>
            <h2 id="modelDialogTitle">模型设置</h2>
            <p id="modelConfigState">正在读取配置</p>
          </div>
          <button id="closeModelDialogBtn" class="icon-button" type="button" aria-label="关闭模型设置" title="关闭">×</button>
        </div>

        <label>
          接口地址
          <input id="modelBaseUrlInput" type="url" placeholder="https://api.example.com/v1" autocomplete="url" />
        </label>

        <label>
          模型名称
          <input id="modelNameInput" type="text" placeholder="填写服务商提供的模型名称" autocomplete="off" />
        </label>

        <label>
          API Key
          <input id="modelApiKeyInput" type="password" placeholder="已保存的 Key 不会显示；留空则保持不变" autocomplete="off" />
        </label>

        <div class="dialog-actions">
          <button id="localModeBtn" class="ghost-button" type="button">使用本地模式</button>
          <button id="testModelBtn" class="ghost-button" type="button">测试连接</button>
          <button id="saveModelBtn" class="primary-button compact-button" type="submit">保存并启用</button>
        </div>
      </form>
    </dialog>

    <script src="/static/app.js"></script>
  </body>
</html>
